#This docker compose will be for local dev
#run docker compose up
# it runs a postgres and redis

services:

#postgres, flyway runs migrations to this when backend is started
# connextion string: localhost:5432/hackathon_db

  postgres:
    image: pgvector/pgvector:pg16
    container_name: hackathon-postgres
    environment:
      POSTGRES_DB: hackathon_db
      POSTGRES_USER: hackathon_user
      POSTGRES_PASSWORD: hackathon_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hackathon_user -d hackathon_db"]
      interval: 10s
      timeout: 5s
      retries: 5

#Redis just here for now, planned logic is in sprint 4
# connection string: localhost:6379

  redis:
    image: redis:7-alpine
    container_name: hackathon-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

#tree-sitter AST parsing + CodeBERT embedding sidecar for plagiarism detection

  ast-service:
    build:
      context: ./ast-service
    container_name: hackathon-ast-service
    ports:
      - "8008:8008"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8008/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
      
  #Java runner
  java-runner:
    build:
      context: .
      dockerfile: docker/java-runner/Dockerfile
    image: hackathon-java-runner:1
    entrypoint:
      - /bin/sh
      - -c
      - exit 0
    restart: "no"

  #Browser IDE
  browser-ide:
    build:
      context: .
      dockerfile: docker/browser-ide.Dockerfile
    image: hackathon-browser-ide:1
    entrypoint: 
      - /bin/sh
      - -c
      - exit 0
    restart: "no"

    
  #AI DETECTION MODEL
  ai-model:
    build:
      context: ./ML-AI
      dockerfile: Dockerfile
    image: hackathon-ai-model:1
    container_name: hackathon-ai-model
    ports: 
      - "127.0.0.1:8001:8001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      
volumes:
  postgres_data: