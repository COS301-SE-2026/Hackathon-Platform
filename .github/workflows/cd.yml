name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:


concurrency:
  group: cd-production
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: af-south-1
  AWS_ROLE_ARN: arn:aws:iam::810876576740:role/GitHubActions-HackathonPlatform-Deploy
  AWS_ACCOUNT_ID: "810876576740"
  ECR_REGISTRY: 810876576740.dkr.ecr.af-south-1.amazonaws.com
  BACKEND_REPOSITORY: hackathon-backend
  BACKEND_ECS_CLUSTER: hackathon-platform-cluster
  BACKEND_ECS_SERVICE: hackathon-backend-service
  BACKEND_TASK_FAMILY: hackathon-backend
  BACKEND_CONTAINER_NAME: backend

  AI_REPOSITORY: hackathon-ai-model
  AI_ECS_CLUSTER: hackathon-platform-cluster
  AI_ECS_SERVICE: hackathon-ai-model-service
  AI_TASK_FAMILY: hackathon-ai-model

  AST_REPOSITORY: hackathon-ast-service
  AST_ECS_CLUSTER: hackathon-platform-cluster
  AST_ECS_SERVICE: hackathon-ast-service
  AST_TASK_FAMILY: hackathon-ast-service

  S3_BUCKET: hackathon-platform-frontend-810876576740
  CLOUDFRONT_DISTRIBUTION_ID: E1XXY169KIIHU7

jobs:

  build-backend:
    name: Build and Push Backend
    runs-on: ubuntu-latest
    timeout-minutes: 25

    outputs:
      image: ${{ steps.image.outputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-CD-Backend

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image
        id: image
        shell: bash
        run: |
          IMAGE="${ECR_REGISTRY}/${BACKEND_REPOSITORY}:${GITHUB_SHA}"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Setup BuildX
        uses: docker/setup-buildx-action@v3

      - name: Build backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./docker/backend.Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.image }}
            ${{ env.ECR_REGISTRY }}/${{ env.BACKEND_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-ai:
    name: Build and push AI
    runs-on: ubuntu-latest
    timeout-minutes: 25

    outputs:
      image: ${{ steps.image.outputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-CD-AI

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image
        id: image
        shell: bash
        run: |
          IMAGE="${ECR_REGISTRY}/${AI_REPOSITORY}:${GITHUB_SHA}
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Setup BuildX
        uses: docker/setup-buildx-action@v3

      - name: Build AI container
        uses: docker/build-push-action@v6
        with:
          context: ./ML-AI
          file: ./ML-AI/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.image }}
            ${{ env.ECR_REGISTRY }}/${{ env.AI_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-ast:
    name: Build and push AST service
    runs-on: ubuntu-latest
    timeout-minutes: 25

    outputs:
      image: ${{ steps.image.outputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-CD-AST

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image
        id: image
        shell: bash
        run: |
          IMAGE="${ECR_REGISTRY}/${AST_REPOSITORY}:${GITHUB_SHA}"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Setup BuildX
        uses: docker/setup-buildx-action@v3

      - name: Build AST service
        uses: docker/build-push-action@v6
        with:
          context: ./ast-service
          file: ./ast-service/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.image }}
            ${{ env.ECR_REGISTRY }}/${{ env.AST_REPOSITORY }}:lastest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend:
    name: Build UI
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build -- --configuration production

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/frontend/browser
          if-no-files-found: error

  deploy-backend:
    name: Deploy backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build-backend
    environment: production

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-Deploy-Backend

      - name: Download task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "$ECS_TASK_FAMILY" \
            --query taskDefinition \
            --output json > task-definition.json

      - name: Render task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.BACKEND_CONTAINER_NAME }}
          image: ${{ needs.build-backend.outputs.image }}

      - name: Deploy ECS service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.BACKEND_ECS_SERVICE }}
          cluster: ${{ env.BACKEND_ECS_CLUSTER }}
          wait-for-service-stability: true

  deploy-ai:
    name: Deploy AI ML
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build-ai
    environment: production

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GithubActions-Deploy-AI

      - name: Download task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "$AI_TASK_FAMILY" \
            --query taskDefinition \
            -- output json > task-definition.json

      - name: Render task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ai-model
          image: ${{ needs.build-ai.outputs.image }}

      - name: Deploy ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition:  ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.AI_ECS_SERVICE }}
          cluster: ${{ env.AI_ECS_CLUSTER }}
          wait-for-service-stability: true

  deploy-ast:
    name: Deploy AST service
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build-ast
    environment: production

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-Deploy-AST

      - name: Download task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "$AST_TASK_FAMILY" \
            --query taskDefinition \
            --output json > task-definition.json

      - name: Render task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ast
          image: ${{ needs.build-ast.outputs.image }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.AST_ECS_SERVICE }}
          cluster: ${{ env.AST_ECS_CLUSTER }}
          wait-for-service-stability: true

  deploy-frontend:
    name: Deploy frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-frontend
    environment: production

    steps:
      - name: Setup AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-Deploy-Frontend

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend-dist

      - name: Sync to S3
        run: |
          aws s3 sync frontend-dist "s3://${S3_BUCKET}" \
            --delete \
            --region "$AWS_REGION"

      - name: Invalidate Cloudfront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/*"

  production-health-check:
    name: Production health check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - deploy-backend
      - deploy-ai
      - deploy-ast
      - deploy-frontend

    steps:
      - name: Check backend health
        run: |
          curl --fail --silent --show-error \
            --retry 10 \
            --retry-delay 5 \
            --retry-connrefused \
            https://api.hackathonplatform.co.za/actuator/health

      - name: Check frontend
        run: |
          curl -- fail --silent --show-error \
            --retry 10 \
            --retry-delay 5 \
            https://hackathonplatform.co.za/