name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:


concurrency:
  group: cd-production
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: af-south-1

  AWS_ROLE_ARN: arn:aws:iam::810876576740:role/GitHubActions-HackathonPlatform-Deploy

  ECR_REPOSITORY: hackathon-backend

  ECS_CLUSTER: hackathon-platform-cluster
  ECS_SERVICE: hackathon-backend-service
  ECS_TASK_DEFINITION_FAMILY: hackathon-backend
  ECS_CONTAINER_NAME: backend

  S3_BUCKET: hackathon-platform-frontend-810876576740
  CLOUDFRONT_DISTRIBUTION_ID: E1XXY169KIIHU7

jobs:

  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20

    outputs:
      image: ${{ steps.image.outputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-CD

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image
        id: image
        shell: bash
        run: |
          IMAGE="${{ steps.ecr.outputs.registry }}/${ECR_REPOSITORY}:${GITHUB_SHA}"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"