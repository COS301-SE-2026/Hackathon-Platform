#this auto deploys to azure
name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-production
  cancel-in-progress: false

env:
  REGISTRY: hackathonplatformcr.azurecr.io
  RESOURCE_GROUP: hackathon-platform-rg

jobs:
  build-and-push:
    name: Build and Push
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      image-tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image tag
        id: tag
        run: echo "tag=$(date +%Y%m%d%H%M%S)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Log In
        uses: azure/docker-login@v2
        with:
          login-server: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push(backend)
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: docker/backend.Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/backend:${{ steps.tag.outputs.tag }}
            ${{ env.REGISTRY }}/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push(frontend)
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: docker/frontend.Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/frontend:${{ steps.tag.outputs.tag }}
            ${{ env.REGISTRY }}/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Azure container
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-and-push
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy backend
        uses: azure/container-apps-deploy-action@v2
        with:
          resourceGroup: ${{ env.RESOURCE_GROUP }}
          containerAppName: hackathon-backend
          imageToDeploy: ${{ env.REGISTRY }}/backend:${{ needs.build-and-push.outputs.image-tag }}

      - name: Deploy frontend
        uses: azure/container-apps-deploy-action@v2
        with:
          resourceGroup: ${{ env.RESOURCE_GROUP }}
          containerAppName: hackathon-frontend
          imageToDeploy: ${{ env.REGISTRY }}/frontend:${{ needs.build-and-push.outputs.image-tag }}

      - name: Check health after deploy
        run: |
          sleep 20
          BACKEND_URL=$(az containerapp show --name hackathon-backend \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query properties.configuration.ingress.fqdn -o tsv)
          curl -f "https://${BACKEND_URL}/actuator/health" || exit 1
