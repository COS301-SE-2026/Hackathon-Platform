
<div class="login-page">

<section class="login-hero">
  <img src="assets/images/robots.jpg" alt="Robots Coding" class="login-hero-image"/>
</section>

  <section class="login-section">

    <div class="login-container">

      <h1 class="login-title">Login</h1>

      <p class="login-subtitle"> Enter your email and password to continue.</p>


      <form #loginForm="ngForm" (ngSubmit)="onSignIn()">

        <div class="login-input">
          <app-input id="email" label="Email" type="email" placeholder="Enter your email" [(value)]="email"/>
        </div>

        <div class="login-input">
        <app-input id="password" label="Password" type="password" placeholder="Enter your password" [(value)]="password"/>
        </div>

        <div class="forgot-password">
          <a routerLink="/forgot-password">Forgot password?</a>
        </div>

        <app-button variant="primary" type="submit" width="100%" [disabled]="isLoading"> {{ isLoading ? 'Logging in...' : 'Log in' }}</app-button>

        <div class="divider">
         <span></span><p>or</p><span></span>
        </div>

        @if (showVerificationPrompt) {
          <div class="verification-prompt">
            <button type="button" class="resend-button" [disabled]="isResending" (click)="resendVerification()">
              {{ isResending ? 'Sending' : 'Resend verification email' }}
            </button>
          </div>
        }

        <button type="button" class="google-button" (click)="continueWithGoogle()">
          <img src="assets/images/google_icon.svg" alt="Google_Icon" class="google-icon"/>
          <span>Continue with Google</span>
        </button>

        <p class="register-text"> Don't have an account yet?
          <a routerLink="/register">Register</a>
        </p>

      </form>

    </div>

  </section>

</div>
