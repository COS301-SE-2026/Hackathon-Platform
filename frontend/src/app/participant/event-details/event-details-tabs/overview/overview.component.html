<div class="overview-page">

<h1 class="event-title">{{ event.name }}</h1>

<p class="event-description">{{ event.description }}</p>

<div class="event-meta">

<div class="meta-item">
<span class="meta-label">Prize Pool</span>
    <span class="meta-value">{{ event.prizePool }}</span>
</div>

<div class="meta-item">
<span class="meta-label">Start Date</span>
<span class="meta-value">{{ event.startDate }}</span>
</div>

<div class="meta-item">
<span class="meta-label">End Date</span>
<span class="meta-value">{{ event.endDate }}</span>
</div>

</div>

<div class="overview-actions">

 <button type="button"  class="primary-btn"> Register </button>

<button 
      type="button" 
      class="secondary-btn"
      [disabled]="downloadingProblemStatement"
      (click)="downloadProblemStatement()">
      {{ downloadingProblemStatement ? 'Downloading...' : 'Download Problem Statement' }}
    </button>
    @if (problemStatementError) {
      <p class="problem-statement-error">{{ problemStatementError }}</p>
    }
    
    </div>

</div>
