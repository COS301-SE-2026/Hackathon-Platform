<div class="rules-page">

  @if (loading) {
  <div class="rules-message">
     <i class="pi pi-spin pi-spinner" aria-hidden="true"></i>
     <p>Loading rules...</p>
   </div>
  }

  @else if (errorMsg) {
  <div class="rules-message"><p>{{ errorMsg }}</p></div>
  }

  @else if (event) {

  @if (event.rules) {

      <div class="rules-header">
      <h2>Event Rules</h2>
      <p>Please review the rules and requirements for this event.</p>
    </div>

      <section class="rules-section">

        <div class="section-heading">
          <i class="pi pi-book" aria-hidden="true"></i>

          <div>
          <h3>Rules & Requirements</h3>
          </div>
        </div>
        <div class="rules-content"> {{ event.rules }}</div>
      </section>

  } 
    
    @else {
      <app-empty-state icon="pi-info-circle" title="No Rules Available" description="No rules have been provided for this event yet."></app-empty-state>
     }
  }

</div>
