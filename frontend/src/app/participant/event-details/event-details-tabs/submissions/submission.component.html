<div class="submission-page">

    <div class="submission-header">
        <h1 class="submission-title">Upload Your Solution</h1>
        <p class="submission-prompt">Select a level below to view its requirements and upload your solution.</p>
    </div>

    <p-tabs
        [(value)]="activeLevel"
        scrollable>
        
        <p-tablist>

         @for (level of levels; track level.id) {
                <p-tab [value]="level.id.toString()">{{ level.name }}</p-tab>
            }

        </p-tablist>

        <p-tabpanels>

            @for (level of levels; track level.id) {

                <p-tabpanel [value]="level.id.toString()">

                    <div class="level-content">

                       <div class="level-header">

                            <div class="level-info">
                                <div class="level-number">{{ level.id }}</div>
                                <h2 class="level-name">{{ level.name }}</h2>
                            </div>

                            <button
                                pButton
                                type="button"
                                label="Download Level Files"
                                class="download-level-btn">
                            </button>

                         </div>

                    </div>

                </p-tabpanel>

            }

        </p-tabpanels>

    </p-tabs>

</div>
