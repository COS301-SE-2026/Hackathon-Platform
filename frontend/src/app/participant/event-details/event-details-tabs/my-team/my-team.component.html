@if (isLoadingTeam) {   <p>Team Loading...</p>  }

@else if (hasTeam == false) {

<div class="no-team-page">

    <i class="pi pi-users empty-icon"></i>

    <h2>You're currently not part of a team</h2>

    <p>Join an existing team or create your own team to collaborate during this hackathon.</p>

    <div class="team-buttons">

        <button
            pButton
            label="Create Team"
            class="create-team-btn"
            (click)="createTeamDialogVisible = true"
            >
        </button>

        <button
            pButton
            label="Request to Join"
            class="join-team-btn">
        </button>

    </div>

</div>

}




<p-dialog header="Create Team" class="team-dialog"  [(visible)]="createTeamDialogVisible"  [modal]="true"  [draggable]="false"  [style]="{ width: '420px' }">

    <p class="dialog-prompt"> Enter a unique name for your hackathon team.</p>

    <label for="teamName">Team Name</label>

    <input pInputText id="teamName"  [(ngModel)]="newTeamName"  placeholder="Enter team name"  class="team-name-input" />

    <div class="team-dialog-buttons">

        <button
            pButton
            label="Cancel"
            class="team-dialog-cancel"
            (click)="createTeamDialogVisible = false">
        </button>

        <button
            pButton
            label="Create Team"
            class="team-dialog-create-btn"
            (click)="onCreateTeam()"
            [disabled]="!newTeamName.trim() || isLoading">
        </button>

    </div>

</p-dialog>
