<div class="leaderboard-page">

 <div class="leaderboard-header">

     <h1 class="leaderboard-title">Current Standings</h1>
     
      <p class="leaderboard-prompt">See how your team ranks against the competition.</p>

        <div class="my-team-summary">

            <div class="team-rank">#{{ myTeam.rank }}</div>

            <div class="team-info">

            <h2 class="team-name">{{ myTeam.name }}<span class="team-tag"> — Your Team</span></h2>
               
            <p class="team-score">{{ myTeam.score}} pts</p>
            
          </div>

     </div>

 </div>

</div>
