<div class="event-banner">

  <div class="banner-content">

        <div class="banner-left">

        <button 
                class="leave-btn" 
                type="button">
                <i class="pi pi-arrow-left"></i> Back to Events
        </button>

        <h1 class="event-title">{{ event.name }}</h1>

        <p class="event-description">{{ event.description }}</p>

        <div class="banner-buttons">
                <button
                pButton
                label="Register"
                class="register-btn">
                </button>

                <button
                pButton
                label="Download Problem Statement"
                class="download-btn">
                </button>
        </div>

        </div>

        <div class="banner-right">

        <div class="info-card">
                <i class="pi pi-trophy info-icon"></i>
                <div class="info-content">
                    <span class="label">Prize Pool</span>
                    <span class="value">{{ event.prizePool }}</span>
                </div>

        </div>

        <div class="info-card">
                <i class="pi pi-calendar info-icon"></i>
                <div class="info-content">
                    <span class="label">Start Date</span>
                    <span class="value">{{ event.startDate }}</span>
                </div>
        </div>

        <div class="info-card">
                <i class="pi pi-clock info-icon"></i>
                <div class="info-content">
                    <span class="label">End Date</span>
                    <span class="value">{{ event.endDate }}</span>
                </div>
        </div>

        </div>

  </div>

</div>


<div class="event-body">
    <p-tabs value="overview">
        <p-tablist>
        <p-tab value="overview">Overview</p-tab>

        <p-tab value="rules">Rules</p-tab>

        <p-tab value="submissions">Submissions</p-tab>

        <p-tab value="team">My Team</p-tab>
        
        <p-tab value="leaderboard">Leaderboard</p-tab>
        </p-tablist>

        <p-tabpanels>

        <p-tabpanel value="overview">
            <app-overview/>
        </p-tabpanel>

        <p-tabpanel value="rules">
            <app-rules/>
        </p-tabpanel>

        <p-tabpanel value="submissions">
            <app-submissions/>
        </p-tabpanel>

        <p-tabpanel value="team">
            <app-my-team/>
        </p-tabpanel>

        <p-tabpanel value="leaderboard">
            <app-leaderboard/>
        </p-tabpanel>

        </p-tabpanels>
 </p-tabs>

</div>
