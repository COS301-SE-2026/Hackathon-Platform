<section class="home-banner">

  <img class="home-banner-image" src="assets/images/tech_background.jpg" alt="Digital tech background">
  <div class="home-banner-overlay"></div>
  <div class="home-banner-content">
    <h1>Hackathons</h1>
    <p>Join hackathons, build amazing solutions and make an impact.</p>
  </div>

</section>



<div class="page-container">

  <div class="events-toolbar">

        <div class="events-tabs">
         <app-tabs [tabs]="eventTabs" [activeTab]="activeTab"  activeQueryParam="tab" ariaLabel="Event categories"></app-tabs>
        </div>

        <div class="events-search">
         <app-search-bar placeholder="Search events"></app-search-bar>
        </div>

        <div class="events-sort">
         <app-dropdown [options]="['Newest', 'Oldest']" value="Newest" id="event-sort" label="Sort events"></app-dropdown>
        </div>

  </div>





</div>
