<div class="participant-shell">
  <nav class="navbar" aria-label="Main navigation">
    <div class="navbar-left">
      <div class="logo">
        <img src="assets/images/hackathon_logo_navbar.png" alt="Hackathon Platform Logo" />
      </div>
    </div>

    <div class="navbar-right">
      <div class="navbar-links">
        <a routerLink="/participant/home" routerLinkActive="active">Home</a>
        <a routerLink="/participant/events" routerLinkActive="active">My Events</a>
      </div>

        <div class="user-menu">
      <button
        type="button"
         class="user-menu-btn"
         (click)="toggleUserMenu()"
         (keydown.enter)="toggleUserMenu()"
        (keydown.space)="toggleUserMenu()">

        <div class="user-info">
          <i class="pi pi-user user-icon"></i>
          <span>{{ userName }}</span>
        </div>
          <i class="pi pi-chevron-down"></i>
      </button>

      @if (userMenuOpen) {

      <div class="user-dropdown">
        <button type="button" (click)="logout()">
          <i class="pi pi-sign-out"></i>
          <span>Logout</span>
        </button>

      </div>

      }


    </div>

    </div>   
    
    <div class="mobile-menu-btn">
      <p-button 
        icon="pi pi-bars" 
        styleClass="hamburger-btn"
        (click)="sidebarVisible = true"
        (keydown.enter)="sidebarVisible = true"
        (keydown.space)="sidebarVisible = true"
      ></p-button>
    </div>
  </nav>

  <p-drawer 
    [(visible)]="sidebarVisible" 
    [position]="'right'"
    [baseZIndex]="10000"
    styleClass="mobile-drawer"
  >
    <div class="drawer-content">
      <div class="drawer-user">
        <div class="drawer-avatar">
          <i class="pi pi-user"></i>
        </div>
        <span class="drawer-username">{{ userName }}</span>
      
        <button class="drawer-close-btn" (click)="sidebarVisible = false">
            <i class="pi pi-times"></i>
        </button>
      </div>
    

      <nav class="drawer-nav" aria-label="Mobile navigation">
        <a routerLink="/participant/home" routerLinkActive="active" (click)="sidebarVisible = false">
          Home
        </a>
        <a routerLink="/participant/events" routerLinkActive="active" (click)="sidebarVisible = false">
          My Events
        </a>
      </nav>

      <div class="drawer-footer">
        <button class="drawer-logout-btn" (click)="logout()">
          <i class="pi pi-sign-out"></i> Logout
        </button>
      </div>
    </div>
  </p-drawer>

  <main class="event-content">
    <router-outlet></router-outlet>
  </main>


  <footer class="site-footer">
  © 2026 Hackathon Platform. All rights reserved.
</footer>
</div>
