
<section class="auth-hero">
  <img src="assets/images/auth_hero.png" alt="Team coding together" class="auth-hero-image"/>

  <div class="auth-hero-logo">
    <img src="assets/images/logo.png" alt="Hackathon Platform Logo" />
  </div>

  <div class="auth-hero-content">
    
    <span class="hero-label">

        <span class="hero-status-dot"></span>{{ label }}

    </span>

    <h2>{{ heading }}</h2>

    <p>{{ description }}</p>

    <div class="hero-accent-line"></div>
  </div>
</section>
