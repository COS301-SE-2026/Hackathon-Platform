<nav class="tabs" [class.tabs-subtabs]="variant === 'subtabs'" [attr.aria-label]="ariaLabel">

 @for (tab of tabs; track $index) {

  @if (tab.type === 'label') {

  <span class="tab-label">

    @if (tab.icon) {<i [class]="tab.icon" aria-hidden="true"></i>}

    <span>{{ tab.label }}</span>

  </span>

    } 
    @else {

    <a class="tab" [routerLink]="local ? null : tab.route" [queryParams]="local ? null : tab.queryParams"
      [class.active]="local ? tab.value === activeLocalTab : tab.queryParams?.[activeQueryParam] === activeTab"
      (click)="local && onLocalTabClick(tab)"
    >

     @if (tab.icon) { <i [class]="tab.icon" aria-hidden="true"></i>}

     <span>{{ tab.label }}</span>

    </a>

  }

 }

</nav>
