<div class="textarea-wrapper">

<label [for]="id" class="sr-only">{{ label }}</label>

<textarea class="textarea" [id]="id" [(ngModel)]="value" [attr.placeholder]="placeholder" [attr.maxlength]="maxLength" [attr.rows]="rows"></textarea>

<div class="textarea-counter">{{ characterCount }} / {{ maxLength }}</div>

</div>
