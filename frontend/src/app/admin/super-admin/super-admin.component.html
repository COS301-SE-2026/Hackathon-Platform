<div class = "super-admin-page">

    <header class = "super-admin-topbar">
        <div class = "brand">
            <span class = "brand-line1">Hackathon</span>
            <span class = "brand-line2">Platform</span>
            <span class = "super-admin-tag">Super Admin</span>
        </div>
        <button type = "button" class ="logout-btn" (click) = "logout()">
            <i class = "pi pi-sign-out"></i>Logout
        </button>
    </header>

    <main class = "super-admin-content">
        <div class = "page-header">
            <h1>User Management</h1>
            <p class = "page-subtitle">Logged is as: <string>{{loggedInAsName}}</string></p>
        </div>

        <div class = "panel-card">
            <div class = "panel-header">
                <div>
                    <h2 class = "panel-title">Create AdminA Account</h2>
                    <p class = "panel-subtitle">Create a new administrator login for this platform.</p>
                </div>
            </div>

            @if (createAdminError){
                <p class = "form-error">{{createAdminError}}</p>
            }@if (createAdminSuccess){
                <p class = "form-success">{{createAdminSuccess}}</p>
            }
            <form (ngSubmit) = "createAdminAccount()" class = "create-admin-form">
                <div class = "form-group">
                    <label for = "adminEmail">Email</label>
                    <input id = "adminEmail" type = "email" name = "adminEmail" [(ngModel)] = "newAdmin.email" placeholder = "admin@example.com" required>
                </div>
                <div class = "form-group">
                    <label for = "adminPassword">Password</label>
                    <input id = "adminPassword" type = "password" name = "adminPassword" [(ngModel)] = "newAdmin.password" placeholder = "At least 8 characters" required>
                </div>
                <div class = "form-group">
                    <label for = "adminConfirmPassword">Confirm Password</label>
                    <input id = "adminConfirmPassword" type = "password" name = "adminConfirmPassword" [(ngModel)] = "newAdmin.confirmPassword" placeholder = "Re-enter password" required>
                </div>
                <button type = "submit" class = "btn-primary create-admin-btn" [disabled] = "isCreatingAdmin">
                    {{ isCreatingAdmin ? 'Creating...' : 'Create Admin Account'}}
                </button>
            </form>
        </div>

    </main>
</div>
