<div class = "admin-shell">
    <nav class = "navbar">
        <div class = "navbar-container">
            <div class = "navbar-brand">
                <a routerLink = "/admin/dashboard">
                <img src="assets/images/hackathon_logo_navbar.png" alt="Hackathon Platform" class = "brand-logo" />
                <span class = "brand-text">
                    <span class = "brand-line1">Hackathon</span>
                    <span class = "brand-line2">Platform</span>
                </span>
                </a>
            </div>

      

        <div class = "navbar-links" [class.navbar-links-open] = "isMenuOpen">
            <ul>
                <li>
                    <a routerLink = "/admin/dashboard" routerLinkActive = "active" (click)="closeMenu()">
                        <i class = "pi pi-home"></i><span>Home</span>
                    </a>
                </li>
                <li>
                    <a routerLink = "/admin/hackathons" routerLinkActive = "active" (click)="closeMenu()">
                    <i class = "pi pi-th-large"></i><span>Hackathons</span>
                 </a>
                </li>
            
            <li>
                <a routerLink = "/admin/settings" routerLinkActive = "active" (click)="closeMenu()">
                <i class = "pi pi-cog"></i><span>Settings</span>
                </a>
                </li>
            </ul>  
        </div>


            <div class = "navbar-right">
                <button class = "navbar-notifications" aria-label = "Notifications" (click) = "toggleNotifications()">
                    <i class = "pi pi-bell"></i>
                    <span class = "notification-badge" *ngIf = "notificationCount > 0">{{ notificationCount }}</span>
                </button>

                <div class = "navbar-profile" (click) = "toggleProfileMenu()">
                    <div class = "avatar-circle">{{ getInitials() }}</div>
                <div class = "user-info">
                    <span class = "user-name">{{ userName }}</span>
                    <span class = "user-role">{{ userRole }}</span>
                </div>
                <i class = "pi pi-chevron-down profile-chevron"></i>
                </div>
                <button class = "navbar-logout" (click) = "logout()">
                    <i class = "pi pi-sign-out"></i>
                    <span>Logout</span>
                </button>

                <button class = "navbar-toggle" aria-label = "Toggle navigation" (click) = "toggleMenu()">
                    <i class = "pi" [ngClass] ="isMenuOpen ? 'pi-times' : 'pi-bars'"></i>
                   
                </button>
    </div>
</div>
        @if(isProfileMenuOpen){
            <div class = "profile-dropdown">
                <a routerLink = "/admin/settings" class = "dropdown-item" (click) = "closeProfileMenu()">
                    <i class = "pi pi-cog"></i>
                    Settings
                </a>
                <div class = "dropdown-divider"></div>
                <button class = "dropdown-item" (click) = "logout()">
                    <i class = "pi pi-sign-out"></i>
                    Logout
                </button>
            </div>
        }
        @if (isNotificationsOpen){
            <div class = "notifications-dropdown">
                <div class = "dropdown-header">Notifications</div>
                @if (notificationCount === 0){
                    <div class = "dropdown-empty">No new notifications</div>
                }
            </div>
        }
    </nav>
    <main class = "admin-main">
        <div class = "admin-content">
            <router-outlet></router-outlet>
        </div>
    </main>
</div>
