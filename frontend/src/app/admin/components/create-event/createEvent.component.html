<div class = "create-event-page">
  <main class = "content">

     <div class = "back-navigation" >
      <button class = "btn-secondary" (click) = "goBack()"> Back to Events
      </button>
    </div>
    <div class = "page-header">
      <h1>Create new Event</h1>
      <p class = "page-subtitle">Configure all event parameters before publishing</p>
    </div>
    @if (errorMessage){
      <div class = "error-message">
        {{ errorMessage }}
      </div>
    }

    <form (ngSubmit) = "createEvent()" class = "event-form">
      <div class = "form-section">
        <h2 class = "section-heading">Basic Information :</h2>

        <div class = "form-group">
          <label for = "eventName">Event Name</label>
          <input 
          type = "text" 
          id = "eventName" 
          name = "eventName" 
          [(ngModel)] = "form.eventName" 
          required />
        </div>
        <div class = "form-row">
          <div class = "form-group">
            <label for = "startDate">Start Date &amp; Time *</label>
            <input 
            type = "datetime-local" 
            id = "startDate" 
            name = "startDate" 
            [(ngModel)] = "form.startDate" 
            required />
          </div>

          <div class = "form-group">
            <label for = "duration">Duration (hours) *</label>
            <input 
            type = "number" 
            id = "duration" 
            name = "duration" 
            min = '1'
            [(ngModel)] = "form.duration" 
            required />
          </div>
        </div>

        <div class = "form-group">
          <label for = "teamSizeLimit">Team Size Limit *</label>
          <input
          type = "number" 
            id = "teamSizeLimit" 
            name = "teamSizeLimit" 
            min = '1'
            [(ngModel)] = "form.teamSizeLimit" 
            required />
        </div>
      </div>

      <div class = "form-section">
        <h2 class = "section-heading">Visibility &amp; Access</h2>
        <div class = "toggle-group" role = "group" aria-label = "Visibility selection">
       <button
       type = "button"
        class = "toggle-option"
        [class.selected] = "form.visibility === 'PUBLIC'"
        (click) = "form.visibility = 'PUBLIC'"
        >
          <span class = "toggle-title">Public</span>
          <span class = "toggle-description">Anyone can view and register for the event</span>
        </button>
        <button
        type = "button"
        class = "toggle-option"
        [class.selected] = "form.visibility === 'PRIVATE'"
        (click) = "form.visibility = 'PRIVATE'"
        >
          <span class = "toggle-title">Private</span>
          <span class = "toggle-description">Only invited users can view and register for the event</span>
        </button>
        </div>

        @if (form.visibility === 'PRIVATE'){
          <div class = "form-group" style = "margin-top: 16px; ">
            <label for = "registrationKey">Registration Key *</label>
            <input 
            type = "text" 
            id = "registrationKey" 
            name = "registrationKey" 
            [(ngModel)] = "form.registrationKey" 
            required />
          </div>
        }
      </div>

      <div class = "form-section">
        <h2 class = "section-heading">Rules &amp; Description</h2>
        <textarea
        [(ngModel)] = "form.description"
        name = "description"
        rows = "4"></textarea>
      </div>

      <div class = "form-actions">
        <button type = "button" class = "btn-secondary" (click) = "onSaveDraft()" [disabled] ="isLoading">
          @if (isLoading){
            <span>Saving...</span>
          } @else{
            <span>Save Draft</span>

          }</button>

          <button type = "submit" class = "btn-primary" [disabled] ="isLoading">
          @if (isLoading){
            <span>Creating...</span>
          } @else{
            <span>Create Event</span>

          }
          </button>
     </div>
    </form>
  </main>
</div>
