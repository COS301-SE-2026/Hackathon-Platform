<div class = "event-shell-page">
 
  
    <header class = "event-bar-wrap">
      <div class = "event-bar">

        <div class = "event-bar-top">
          <div class="event-title-group">
            <button type="button" class = "back-btn" (click) = "goBackToEvents()" aria-label="Back to events" title="Back to events">
              <i class = "pi pi-arrow-left"></i>
            </button>
            <h1 class = "event-title" [title] = "event?.description || ''">{{event?.name || 'Loading...'}}</h1>
            @if (statusLabel){
              <span class = "status-pill" [ngClass] = "statusLabel.toLowerCase()">{{statusLabel}}</span>
            }
          </div>
          <div class = "event-stats">
            <span class = "stat"><strong>{{teamsCount}}</strong> teams</span>
            <span class = "stat"><strong>{{participantsCount}}</strong> participants</span>
            <span class = "stat"><strong>{{submissionsCount}}</strong> submissions</span>
          </div>
        </div>
    
    <nav class = "event-tabs">
       <a [routerLink]="['/admin/hackathons', hackathonId, 'events', eventId, 'dashboard']" routerLinkActive="active">
      <i class="pi pi-th-large"></i> Dashboard
    </a>
       <a [routerLink]="['/admin/hackathons', hackathonId, 'events', eventId, 'live-control']" routerLinkActive="active">
      <i class="pi pi-bolt"></i> Live Control
    </a>
       <a [routerLink]="['/admin/hackathons', hackathonId, 'events', eventId, 'announcements']" routerLinkActive="active">
      <i class="pi pi-megaphone"></i> Announcements
    </a>
     <a [routerLink]="['/admin/hackathons', hackathonId, 'events', eventId, 'forum']" routerLinkActive="active">
      <i class="pi pi-comments"></i> Forum
    </a>
     <a [routerLink]="['/admin/hackathons', hackathonId, 'events', eventId, 'teams']" routerLinkActive="active">
      <i class="pi pi-users"></i> Teams
    </a>
    <a [routerLink]="['/admin/hackathons', hackathonId, 'events', eventId, 'dietary']" routerLinkActive="active">
      <i class="pi pi-apple"></i> Dietary Requirements
    </a>
     <a [routerLink]="['/admin/hackathons', hackathonId, 'events', eventId, 'manage']" routerLinkActive="active">
      <i class="pi pi-cog"></i> Manage Events
    </a>

      
  </nav>
      </div>
    </header>

<main class = "content">
    <router-outlet></router-outlet>
</main>
    </div>
