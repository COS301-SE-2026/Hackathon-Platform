azure:
  storage:
    connection-string: ${AZURE_STORAGE_CONNECTION_STRING}
    containers:
      event-resources: event-resources
      submissions: submissions
      scoring-logs: scoring-logs
    sas-expiry-minutes: 60


scoring:
  solver:
    timeout-seconds: ${SOLVER_TIMEOUT_SECONDS:30}
    python-executable: ${SOLVER_PYTHON_EXECUTABLE:python}
    workdir: ${SOLVER_WORKDIR:/tmp/hackathon-scoring}
    max-output-bytes: 1048576
    allowed-env-keys: ${SOLVER_ALLOWED_ENV_KEYS:PATH,HOME,LANG,LC_ALL,SystemRoot}
    memory-limit-mb: ${SOLVER_MEMORY_LIMIT_MB:512}
    cpu-limit-seconds: ${SOLVER_CPU_LIMIT_SECONDS:30}
  queue:
    stream-key: scoring:jobs
    consumer-group: scoring-workers
    concurrency: ${SCORING_CONCURRENCY:10}
    poll-timeout-ms: 2000
    pending-min-idle-ms: 60000

spring:
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 8MB
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}