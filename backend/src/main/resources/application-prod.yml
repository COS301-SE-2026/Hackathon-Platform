spring:
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:10000}
      password: ${REDIS_PASSWORD}
      ssl:
        enabled: true

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never